[package]
name = "mfd-tui"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "Manto.FreeDisk TUI: navigazione interattiva dell'albero dello spazio disco (ratatui + crossterm sul motore mfd-core)"

[dependencies]
mfd-core = { path = "../mfd-core" }
# crossterm non e' una dipendenza diretta: si usa tramite la re-export
# ratatui::crossterm, cosi' la versione e' sempre quella del backend
ratatui = "0.30"
# NOTA su parking_lot (transitivo di crossterm): la parking_lot_core 0.9.12
# dipende da windows-link, che sul target x86_64-pc-windows-gnu genera le
# librerie di importazione con dlltool all'atto della build; il toolchain gnu
# di rustup non ha l'assembler che dlltool richiede (serve un MinGW completo).
# Le 0.12.4 / 0.9.11 usano windows_x86_64_gnu con librerie precompilate e
# costruiscono senza nulla di tutto cio'. Da ripensare quando
# crossterm/windows-link sistemano il target gnu.
parking_lot = "=0.12.4"
parking_lot_core = "=0.9.11"

# NOTA: [profile.release] sta nel Cargo.toml del workspace (rust/), non qui:
# Cargo ignora i profili dichiarati nei crate member.
