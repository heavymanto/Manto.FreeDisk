# CI — i test del workspace a ogni push e pull request.
# Tutti e tre i sistemi bloccano: i test girano uguali ovunque (i path
# dei test seguono il separatore della piattaforma). --no-fail-fast fa
# girare ogni binario di test anche quando uno precedente fallisce,
# cosi' un run racconta tutto.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --no-fail-fast --manifest-path rust/Cargo.toml
