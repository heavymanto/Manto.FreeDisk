# CI — i test del workspace a ogni push e pull request.
# Windows e' il prodotto di oggi (il no-stat e' un contratto Win32): i suoi
# test bloccano. Linux e macOS girano in informazione — ancora non
# bloccano, perche' il porting deve arrivare (vedi "Get it" nel README).
# Quando Linux sara' pronto: rimuovere continue-on-error.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --manifest-path rust/Cargo.toml
